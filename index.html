<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rock Paper Scissors (rigged)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #111; color: #fff; font-family: system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; padding: 16px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  #sub { color: #aaa; margin: 0 0 12px; font-size: .9rem; }
  #stage { position: relative; width: min(92vw, 720px); aspect-ratio: 4 / 3;
           background: #000; border-radius: 12px; overflow: hidden; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%;
                  object-fit: cover; transform: scaleX(-1); }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
             align-items: center; justify-content: center; text-align: center;
             text-shadow: 0 2px 8px #000; pointer-events: none; }
  #big { font-size: clamp(3rem, 14vw, 7rem); font-weight: 800; line-height: 1.1; }
  #small { font-size: clamp(1rem, 3.5vw, 1.5rem); margin-top: 8px; }
  #live { position: absolute; left: 10px; bottom: 8px; font-size: .9rem; color: #ddd;
          text-shadow: 0 1px 4px #000; }
  #score { position: absolute; right: 10px; bottom: 8px; font-size: .9rem; color: #ddd;
           text-shadow: 0 1px 4px #000; }
  button { margin-top: 14px; padding: 12px 28px; font-size: 1.1rem; border: 0;
           border-radius: 10px; background: #e63946; color: #fff; cursor: pointer; }
  button:disabled { background: #444; cursor: default; }
  #controls { margin-top: 14px; display: flex; align-items: center; gap: 10px;
              font-size: .95rem; color: #ccc; }
  #controls input { width: 200px; accent-color: #e63946; }
</style>
</head>
<body>
<h1>Rock Paper Scissors</h1>
<p id="sub">Show your move to the camera. The computer is... not entirely fair.</p>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="overlay"><div id="big"></div><div id="small">Loading hand model...</div></div>
  <div id="live"></div>
  <div id="score"></div>
</div>
<button id="play" disabled>Play (or press SPACE)</button>
<div id="controls">
  <label for="cheat">Cheat level:</label>
  <input id="cheat" type="range" min="0" max="100" value="100">
  <span id="cheatVal">100%</span>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const BEATS = { rock: "paper", paper: "scissors", scissors: "rock" };
const EMOJI = { rock: "✊", paper: "✋", scissors: "✌️" };
const FINGERS = [[8, 6], [12, 10], [16, 14], [20, 18]]; // [tip, pip]: index, middle, ring, pinky

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const bigEl = document.getElementById("big");
const smallEl = document.getElementById("small");
const liveEl = document.getElementById("live");
const scoreEl = document.getElementById("score");
const playBtn = document.getElementById("play");

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// A finger is "extended" if its tip is farther from the wrist than its middle joint.
function classify(lm) {
  const wrist = lm[0];
  const ext = FINGERS.map(([tip, pip]) => dist(wrist, lm[tip]) > dist(wrist, lm[pip]) * 1.1);
  const count = ext.filter(Boolean).length;
  if (ext[0] && ext[1] && !ext[2] && !ext[3]) return "scissors";
  if (count === 4) return "paper";
  if (count === 0) return "rock";
  return null;
}

let landmarker;
let state = "idle";            // idle -> countdown -> result
let t0 = 0;
let lockVotes = [];            // what the computer sees just BEFORE "SHOOT!"
let finalVotes = [];           // what you show AFTER "SHOOT!" (your real move)
let cw = 0, pw = 0, draws = 0;

const cheatEl = document.getElementById("cheat");
const cheatVal = document.getElementById("cheatVal");
cheatEl.addEventListener("input", () => { cheatVal.textContent = cheatEl.value + "%"; });
cheatEl.addEventListener("keydown", (e) => { if (e.code === "Space") e.stopPropagation(); });

async function init() {
  try {
    const fileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const opts = (delegate) => ({
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate
      },
      runningMode: "VIDEO",
      numHands: 1
    });
    try { landmarker = await HandLandmarker.createFromOptions(fileset, opts("GPU")); }
    catch { landmarker = await HandLandmarker.createFromOptions(fileset, opts("CPU")); }

    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    smallEl.textContent = "Press SPACE or click Play";
    playBtn.disabled = false;
    requestAnimationFrame(loop);
  } catch (err) {
    smallEl.textContent = "Error: " + err.message +
      " (check camera permission and internet; see the note about localhost)";
    console.error(err);
  }
}

function startRound() {
  if (state === "countdown" || !landmarker) return;
  state = "countdown";
  t0 = performance.now();
  lockVotes = [];
  finalVotes = [];
  bigEl.textContent = "";
}

function drawHand(lm) {
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = "#00e5ff";
  for (const p of lm) {
    ctx.beginPath();
    ctx.arc(p.x * w, p.y * h, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const res = landmarker.detectForVideo(video, performance.now());
  let live = null;
  if (res.landmarks && res.landmarks.length) {
    drawHand(res.landmarks[0]);
    live = classify(res.landmarks[0]);
  }
  liveEl.textContent = live ? "I see: " + live : "";

  if (state === "countdown") {
    const e = (performance.now() - t0) / 1000;
    if (e < 3) {
      bigEl.textContent = String(3 - Math.floor(e));
      smallEl.textContent = "Get your hand ready...";
      if (e > 2.3 && live) lockVotes.push(live);   // computer's read, locked before SHOOT
    } else {
      bigEl.textContent = "SHOOT!";
      smallEl.textContent = "";
      if (e > 3.25 && live) finalVotes.push(live); // your real move counts from here
      if (e > 3.7) finishRound();
    }
  }
  requestAnimationFrame(loop);
}

function topVote(arr) {
  if (!arr.length) return null;
  const counts = {};
  arr.forEach(v => counts[v] = (counts[v] || 0) + 1);
  return Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
}

function finishRound() {
  state = "result";
  playBtn.textContent = "Play again (SPACE)";

  const seen = topVote(lockVotes);      // what the computer saw before SHOOT
  const player = topVote(finalVotes);   // what you actually showed
  if (!player) {
    bigEl.textContent = "🤷";
    smallEl.textContent = "I couldn't see a clear move. Try again!";
    return;
  }

  const cheat = Number(cheatEl.value) / 100;
  let computer;
  if (seen && Math.random() < cheat) {
    computer = BEATS[seen];             // the cheat: counter what it saw
  } else {
    const all = Object.keys(BEATS);
    computer = all[Math.floor(Math.random() * all.length)];
  }

  let msg;
  if (player === computer) {
    draws++;
    msg = "Draw.";
  } else if (BEATS[player] === computer) {
    cw++;
    msg = "Computer wins.";
  } else {
    pw++;
    msg = seen && seen !== player
      ? "You switched at the last second and beat it! 😏"
      : "You win! It must have guessed wrong.";
  }

  bigEl.textContent = EMOJI[player] + " vs " + EMOJI[computer];
  smallEl.textContent = `You: ${player.toUpperCase()}  |  Computer: ${computer.toUpperCase()}. ${msg}`;
  scoreEl.textContent = `Computer ${cw} - You ${pw}` + (draws ? ` (draws ${draws})` : "");
}

playBtn.addEventListener("click", startRound);
window.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); startRound(); }
});

init();
</script>
</body>
</html>
